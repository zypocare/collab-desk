<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in · Miracle</title>
<meta name="description" content="Sign in to Miracle as a creator or as a brand.">
<meta property="og:title" content="Sign in · Miracle">
<meta property="og:image" content="https://www.miracleapp.live/og.jpg">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Sign in: pick creator or brand, name the page, and go to that page's own sign-in. */
:root{
  color-scheme:dark;
  --bg:#110D11; --surface:#1A151A; --line:#2E262E; --line-2:#3E343E;
  --ink:#F4EEF2; --ink-2:#C9BFC6; --ink-3:#A39AA1; --on-light:#1E171C;
  --g1:#9C7BFF; --g2:#F25A90; --g3:#FFAE6B; --ok:#6FD08C; --bad:#FF7B70;
  --grad:linear-gradient(115deg,var(--g1),var(--g2) 52%,var(--g3));
  --f-display:'Instrument Serif',Georgia,'Times New Roman',serif;
  --f-body:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--f-body);-webkit-font-smoothing:antialiased;overflow-x:hidden;isolation:isolate}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--g3);outline-offset:3px}
.glow{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.glow i{position:absolute;border-radius:50%;filter:blur(90px)}
.glow i:nth-child(1){width:560px;height:560px;left:-160px;top:-180px;background:var(--g1);opacity:.4}
.glow i:nth-child(2){width:480px;height:480px;right:-140px;top:30%;background:var(--g2);opacity:.28}
.glow i:nth-child(3){width:380px;height:380px;left:20%;bottom:-220px;background:var(--g3);opacity:.16}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;width:min(1240px,100%);margin:0 auto;height:76px;padding:env(safe-area-inset-top,0px) max(20px,env(safe-area-inset-right,0px)) 0 max(20px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:34px;height:34px}
.brand b{font:400 29px/1 var(--f-display);font-style:italic;letter-spacing:-.01em}
.back{font-size:14px;font-weight:600;color:var(--ink-2)}
.back:hover{color:var(--ink)}
main{display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;padding:24px max(16px,env(safe-area-inset-left,0px)) 72px}
.card{width:min(480px,100%);min-width:0;display:grid;grid-template-columns:minmax(0,1fr);gap:18px;padding:34px 32px;border-radius:28px;background:radial-gradient(120% 70% at 0% 0%,rgba(242,90,144,.14),transparent 60%),rgba(26,21,26,.88);box-shadow:inset 0 0 0 1px var(--line-2),0 60px 120px -50px rgba(242,90,144,.45);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.eb{font:700 11.5px/1 var(--f-body);letter-spacing:.3em;text-transform:uppercase;color:var(--ink-2)}
h1{margin:0;font:400 54px/.98 var(--f-display);letter-spacing:-.015em}
h1 em{font-style:italic;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.08em}
.seg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px;padding:6px;border-radius:16px;background:#0c090c;box-shadow:inset 0 0 0 1px var(--line-2)}
.seg label{position:relative;display:grid;place-items:center;gap:2px;min-height:64px;padding:10px 8px;border-radius:11px;cursor:pointer;text-align:center;color:var(--ink-2);transition:background .2s,color .2s}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg b{font-size:15.5px;font-weight:600}
.seg small{font-size:12px;color:var(--ink-3)}
.seg label:has(input:checked){background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--g2)}
.seg label:has(input:focus-visible){outline:2px solid var(--g3);outline-offset:2px}
form{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.l{font:700 11px/1 var(--f-body);letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3)}
.field{display:flex;align-items:center;height:58px;background:#0c090c;box-shadow:inset 0 0 0 1px var(--line-2);transition:box-shadow .2s}
.field:focus-within{box-shadow:inset 0 0 0 1.5px var(--g2),4px 4px 0 var(--g2)}
.field input{flex:1;min-width:0;height:100%;padding:0 4px 0 16px;border:0;background:transparent;outline:0;font:600 18px/1 var(--f-body)}
.field input::placeholder{color:#6f656c}
.field span{padding-right:16px;color:var(--ink-3);font:500 16px/1 var(--f-body);white-space:nowrap}
.hint{margin:0;font-size:13.5px;line-height:1.5;color:var(--ink-3)}
.hint a{color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}
.err{margin:0;padding:10px 12px;background:color-mix(in oklab,var(--bad) 12%,transparent);box-shadow:inset 3px 0 0 var(--bad);color:var(--bad);font-size:14px}
.err[hidden]{display:none}
.neo{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;margin-top:4px;padding:0 24px;border:0;border-radius:0;cursor:pointer;font:700 13px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;background:var(--grad);color:#fff;box-shadow:5px 5px 0 #6A4BC9;transition:transform .12s var(--ease),box-shadow .12s var(--ease)}
.neo:hover{transform:translate(-2px,-2px)}
.neo:active{transform:translate(5px,5px);box-shadow:none}
.neo:disabled{opacity:.6;cursor:default}
.foot{margin:0;text-align:center;font-size:13.5px;color:var(--ink-3)}
.foot a{color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}
@media (max-width:560px){.card{padding:26px 20px;gap:16px}h1{font-size:44px}.brand b{font-size:25px}.brand svg{width:30px;height:30px}.field span{font-size:14px;padding-right:12px}.field input{font-size:17px;padding-left:14px}}
@media (prefers-reduced-motion:reduce){.neo{transition:none}}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"><i></i><i></i><i></i></div>
<header class="top">
  <a class="brand" href="/" aria-label="Miracle home"><svg viewBox="0 0 512 512" aria-hidden="true"><defs><linearGradient id="kg" gradientUnits="userSpaceOnUse" x1="60" y1="100" x2="560" y2="440"><stop offset="0" stop-color="#9C7BFF"/><stop offset=".52" stop-color="#F25A90"/><stop offset="1" stop-color="#FFAE6B"/></linearGradient></defs><g transform="translate(256 256) scale(1.04) translate(-256 -256)"><g transform="translate(256 256) scale(.79) skewX(-13) translate(-304.5 -266)" fill="none" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"><path transform="translate(-13,-10)" stroke="#F4EEF2" d="M64 128C92 104 132 112 144 156C154 220 158 330 156 392C155 420 182 420 182 392C182 300 176 200 196 160C220 104 290 104 300 160C310 220 312 330 310 392C309 420 336 420 336 392C336 300 330 200 350 160C374 104 444 104 452 160C460 230 456 330 452 392C450 440 500 440 540 360M499 384L540 360L545 408"/><path transform="translate(13,10)" stroke="url(#kg)" d="M64 128C92 104 132 112 144 156C154 220 158 330 156 392C155 420 182 420 182 392C182 300 176 200 196 160C220 104 290 104 300 160C310 220 312 330 310 392C309 420 336 420 336 392C336 300 330 200 350 160C374 104 444 104 452 160C460 230 456 330 452 392C450 440 500 440 540 360M499 384L540 360L545 408"/></g></g></svg><b>Miracle</b></a>
  <a class="back" href="/">Back to home</a>
</header>

<main>
  <div class="card">
    <span class="eb">Sign in</span>
    <h1>Welcome <em>back.</em></h1>
    <div class="seg" role="radiogroup" aria-label="Sign in as">
      <label><input type="radio" name="as" value="creator" checked><b>I'm a creator</b><small>Open my studio</small></label>
      <label><input type="radio" name="as" value="brand"><b>I'm a brand</b><small>My dashboard</small></label>
    </div>
    <form id="f" novalidate>
      <button class="neo" type="submit" id="go">Continue</button>
      <p class="hint" id="hint">New to Miracle? <a id="join" href="https://app.miracleapp.live/signup?as=creator">Join as a creator</a>.</p>
    </form>
    <p class="foot">You'll get a 6-digit code by email. No password needed.</p>
  </div>
</main>

<script>
(() => {
  // Everyone signs in on Miracle's own address; a creator then lands in their studio, a brand on its dashboard.
  const APP = 'https://app.miracleapp.live';
  const join = document.getElementById('join');
  const store = (k, v) => { try { v === undefined ? (v = localStorage.getItem(k)) : localStorage.setItem(k, v); } catch { v = null; } return v; };
  const role = () => document.querySelector('input[name="as"]:checked').value;
  function show() {
    const brand = role() === 'brand';
    join.textContent = brand ? 'Join as a brand' : 'Join as a creator';
    join.href = `${APP}/signup?as=${brand ? 'brand' : 'creator'}`;
  }
  const asked = new URLSearchParams(location.search).get('as') || store('mc-signin-as');
  if (asked === 'brand') document.querySelector('input[value="brand"]').checked = true;
  document.querySelectorAll('input[name="as"]').forEach((r) => r.addEventListener('change', show));
  document.getElementById('f').addEventListener('submit', (e) => {
    e.preventDefault();
    store('mc-signin-as', role());
    location.href = `${APP}/login` + (role() === 'brand' ? '?next=%2Fbrand' : '');
  });
  show();
})();
</script>
</body>
</html>
