<!doctype html>
<html>
  <body style="margin:0;padding:0;background:#f7f4f4;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1e171c">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f7f4f4;padding:32px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:460px;background:#ffffff;border-radius:20px;border:1px solid #eae2e2">
            <tr>
              <td style="padding:32px 32px 8px">
                <div style="height:6px;width:56px;border-radius:6px;background:linear-gradient(115deg,#6b3fd4,#d4296a 52%,#f2994a)"></div>
                <h1 style="margin:22px 0 6px;font-size:22px;line-height:1.25;font-weight:700">Your sign-in code</h1>
                <p style="margin:0;color:#5a5057;font-size:15px;line-height:1.5">Enter this code to sign in. It works for one hour.</p>
              </td>
            </tr>
            <tr>
              <td style="padding:20px 32px">
                <div style="font-family:'SF Mono',Consolas,monospace;font-size:34px;font-weight:700;letter-spacing:10px;text-align:center;background:#f2eded;border-radius:14px;padding:18px 0">{{ .Token }}</div>
              </td>
            </tr>
            <tr>
              <td style="padding:0 32px 30px;color:#8c8288;font-size:13px;line-height:1.5">
                If you didn't try to sign in, you can ignore this email. Nobody can sign in without this code.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
