  #miracle-collab-collection .mc-stage { display:grid;place-items:center;min-height:864px;padding:12px 0; }
  #miracle-collab-collection .mc-phone {
    --mc-bg:light-dark(#f8f3f6,#110d12);--mc-surface:light-dark(#ffffff,#211922);--mc-fill:light-dark(#efe7f1,#302333);
    --mc-ink:light-dark(#241a25,#f9f1f7);--mc-muted:light-dark(#756675,#baacbb);--mc-line:light-dark(#ddcfdd,#3a2c3d);
    --mc-purple:light-dark(#7749d9,#b390ff);--mc-pink:light-dark(#ce356f,#f36c9d);--mc-peach:light-dark(#a9612e,#ffb57e);--mc-green:light-dark(#21765e,#78dfc0);
    --mc-photo-ink:#fff7fc;--mc-photo-shade:#160c17;--mc-cover-height:326px;--mc-speed:1;
    position:relative;isolation:isolate;width:min(100%,394px);height:840px;overflow:clip;border:1px solid var(--mc-line);border-radius:32px;
    background:var(--mc-bg);color:var(--mc-ink);font:400 13px/1.45 Inter,system-ui,sans-serif;box-shadow:0 22px 65px -40px color-mix(in oklab,var(--mc-ink) 36%,transparent);color-scheme:dark;
  }
  #miracle-collab-collection .mc-phone * {box-sizing:border-box;}
  #miracle-collab-collection .mc-phone [hidden] {display:none!important;}
  #miracle-collab-collection .mc-phone button {font:inherit;color:inherit;cursor:var(--cursor-interaction,pointer);-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
  #miracle-collab-collection .mc-phone button:focus-visible {outline:2px solid var(--mc-purple);outline-offset:3px;}
  #miracle-collab-collection .mc-phone h1,#miracle-collab-collection .mc-phone h2,#miracle-collab-collection .mc-phone p {margin:0;}
  #miracle-collab-collection .mc-phone svg {width:18px;height:18px;flex:none;}
  #miracle-collab-collection .mc-shell {height:100%;display:flex;flex-direction:column;}
  #miracle-collab-collection .mc-status {display:flex;align-items:center;justify-content:space-between;padding:13px 23px 5px;min-height:33px;font-size:11px;font-weight:600;flex:none;}
  #miracle-collab-collection .mc-status > span:last-child {display:flex;align-items:center;gap:5px;}
  #miracle-collab-collection .mc-status svg {width:12px;height:12px;}
  #miracle-collab-collection .mc-appbar {display:flex;align-items:center;gap:9px;padding:2px 17px 7px;flex:none;min-height:44px;}
  #miracle-collab-collection .mc-wordmark {font:400 24px/.9 'Instrument Serif',Georgia,serif;letter-spacing:-.5px;}
  #miracle-collab-collection .mc-appbar > span {flex:1;color:var(--mc-muted);font-size:11px;text-align:right;}
  #miracle-collab-collection .mc-icon-button {display:grid;place-items:center;width:40px;height:40px;flex:none;padding:0;border:0;border-radius:50%;background:var(--mc-fill);}
  #miracle-collab-collection .mc-icon-button svg {width:16px;height:16px;}
  #miracle-collab-collection .mc-scroll {flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none;position:relative;}
  #miracle-collab-collection .mc-scroll::-webkit-scrollbar {display:none;}
  #miracle-collab-collection .mc-topline {display:flex;align-items:center;justify-content:space-between;margin:13px 20px 0;}
  #miracle-collab-collection .mc-eyebrow {font-size:10px;text-transform:uppercase;letter-spacing:.17em;color:var(--mc-muted);font-weight:600;}
  #miracle-collab-collection .mc-live-summary {display:inline-flex;align-items:center;gap:6px;color:var(--mc-green);font-size:11px;}
  #miracle-collab-collection .mc-live-dot {display:inline-block;flex:none;width:6px;height:6px;border-radius:50%;background:var(--mc-green);position:relative;}
  #miracle-collab-collection .mc-live-dot::after {content:'';position:absolute;inset:-4px;border-radius:50%;background:var(--mc-green);opacity:.25;animation:mc-signal calc(2.2s * var(--mc-speed)) ease-out infinite;}
  #miracle-collab-collection .mc-intro {position:relative;padding:5px 20px 17px;isolation:isolate;}
  #miracle-collab-collection .mc-intro h1 {font:400 42px/1.04 'Instrument Serif',Georgia,serif;letter-spacing:-1px;}
  #miracle-collab-collection .mc-intro h1 em {font-weight:400;color:var(--mc-pink);}
  #miracle-collab-collection .mc-intro p {font-size:11px;color:var(--mc-muted);margin-top:7px;}
  #miracle-collab-collection .mc-intro::before {content:'';position:absolute;z-index:-1;inset:-60px -60px -80px;pointer-events:none;background:radial-gradient(ellipse at 70% 30%,color-mix(in oklab,var(--mc-purple) 15%,transparent),transparent 58%);animation:mc-aura calc(7s * var(--mc-speed)) ease-in-out infinite alternate;}
  #miracle-collab-collection .mc-top-tabs {display:flex;align-items:center;gap:22px;padding:0 20px 12px;}
  #miracle-collab-collection .mc-top-tabs button {display:flex;align-items:center;justify-content:center;gap:6px;min-height:32px;padding:0 0 7px;border:0;border-bottom:2px solid transparent;background:none;color:var(--mc-muted);font-size:11px;}
  #miracle-collab-collection .mc-top-tabs button[aria-selected=true] {color:var(--mc-ink);border-color:var(--mc-pink);}
  #miracle-collab-collection .mc-top-tabs svg {width:14px;height:14px;}
  #miracle-collab-collection .mc-deck {position:relative;height:calc(var(--mc-cover-height) + 30px);perspective:1000px;touch-action:pan-y pinch-zoom;}
  #miracle-collab-collection .mc-deck-halo {position:absolute;inset:15% 0 0;pointer-events:none;background:radial-gradient(ellipse,color-mix(in oklab,var(--mc-pink) 18%,transparent),transparent 65%);animation:mc-aura calc(5s * var(--mc-speed)) ease-in-out infinite alternate;}
  #miracle-collab-collection .mc-cover {
    position:absolute;left:30px;top:5px;width:calc(100% - 60px);height:var(--mc-cover-height);padding:0;border:1px solid color-mix(in oklab,var(--mc-photo-ink) 19%,transparent);
    border-radius:25px;overflow:hidden;background:var(--mc-surface);text-align:left;transform-style:preserve-3d;
    transform:translateX(calc(var(--slot) * 89% + var(--drag,0px))) rotate(calc(var(--slot) * 5deg)) scale(var(--card-scale,.88));
    opacity:var(--card-opacity,.42);z-index:var(--z,0);transition:transform .65s cubic-bezier(.22,1.12,.35,1),opacity .45s,box-shadow .45s;

  function fitPhoto(node) {
    const c = collabs.find(item=>item.id===node.dataset.photo);
    if (!c?.crop || !node.clientWidth || !node.clientHeight) return;
    const [x,y,w,h]=c.crop, width=node.clientWidth,height=node.clientHeight,scale=Math.max(width/w,height/h);
    node.style.backgroundSize=`${574*scale}px ${1280*scale}px`;
    node.style.backgroundPosition=`${(width-w*scale)/2-x*scale}px ${(height-h*scale)/2-y*scale}px`;
  }
  function bindFresh(parent) {
    parent.querySelectorAll('.mc-photo').forEach(node=>{fitPhoto(node);photos.observe(node);});
    parent.querySelectorAll('.mc-cover,.mc-pass,.mc-keepsake,.mc-reader-visual').forEach(node=>ambient.observe(node));
    globalThis.lucide?.createIcons();
  }
  function chrome(type) {
    return `<div class="mc-shell">
      <div class="mc-status"><span>13:31</span><span>${icon('signal')}${icon('wifi')}${icon('battery-full')}</span></div>
      <header class="mc-appbar"><b class="mc-wordmark">miracle<span style="color:var(--mc-pink)">✦</span></b><span>My page</span><button class="mc-icon-button mc-motion" aria-label="Pause motion" aria-pressed="false">${icon('pause')}</button></header>
      <div class="mc-scroll">
        <div class="mc-topline"><span class="mc-eyebrow">The collab collection</span><span class="mc-live-summary"><i class="mc-live-dot"></i>3 live now</span></div>
        ${type==='covers'?'<div class="mc-intro"><h1>Work with <em>a little wow.</em></h1><p>Good brands. Great stories. All yours.</p></div>':'<div class="mc-pass-intro"><h1>Big collabs.<br><em>Little keepsakes.</em></h1><p>A collection of the work you put your name on.</p></div>'}
        <div class="mc-top-tabs" role="tablist" aria-label="Profile content"><button role="tab" id="${type}-collection-tab" aria-controls="${type}-collection-panel" aria-selected="true" data-panel="collection">${icon(type==='covers'?'gallery-horizontal-end':'tickets')}Collabs <span>5</span></button><button role="tab" id="${type}-posts-tab" aria-controls="${type}-posts-panel" aria-selected="false" data-panel="posts">${icon('clapperboard')}Posts</button></div>
        <div class="mc-collection-panel" id="${type}-collection-panel" role="tabpanel" aria-labelledby="${type}-collection-tab"></div>
        <div class="mc-posts" id="${type}-posts-panel" role="tabpanel" aria-labelledby="${type}-posts-tab" hidden>${collabs.filter(c=>c.crop).map(c=>`<button class="mc-post" data-open="${c.id}" aria-label="Open ${escape(c.name)} story">${photo(c)}<span class="mc-cover-shade"></span><span>${c.name}</span></button>`).join('')}</div>
      </div>
      <nav class="mc-nav" aria-label="App navigation"><span>${icon('house')}Today</span><span>${icon('columns-3')}Collabs</span><span>${icon('calendar-days')}Plan</span><span>${icon('wallet')}Money</span><span aria-current="page">${icon('circle-user-round')}My page</span></nav>
    </div><section class="mc-reader" aria-label="Collab story" role="dialog" aria-modal="true" inert></section>`;
  }
  const covers=document.getElementById('mc-covers'),passes=document.getElementById('mc-passes');
  covers.innerHTML=chrome('covers');passes.innerHTML=chrome('passes');
  covers.querySelector('.mc-collection-panel').innerHTML=`
    <div class="mc-deck" aria-label="Campaign cover collection"><div class="mc-deck-halo"></div>
      ${collabs.map((c,i)=>`<button class="mc-cover" data-index="${i}" aria-label="${escape(c.name)}, ${c.work}, ${c.fee}. Open collab story.">${photo(c)}<span class="mc-cover-shade"></span><span class="mc-cover-top">${status(c)}<span class="mc-number">${String(i+1).padStart(2,'0')}</span></span><span class="mc-cover-title"><small>${c.category}</small><h2>${c.name}</h2><span class="mc-cover-meta">${c.work}${c.views!=='—'?` · ${c.views} views`:''}</span><span class="mc-cover-foot"><b>${c.fee}</b><span>View collab<span class="mc-arrow-orb">${icon('arrow-up-right')}</span></span></span></span></button>`).join('')}
    </div>
    <div class="mc-deck-controls"><span class="mc-deck-caption" aria-live="polite"></span><div class="mc-stepper"><button data-step="-1" aria-label="Previous collab">${icon('arrow-left')}</button><button data-step="1" aria-label="Next collab">${icon('arrow-right')}</button></div></div>
    <div class="mc-filmstrip" aria-label="Choose a collab">${collabs.map((c,i)=>`<button class="mc-thumb" data-index="${i}" aria-pressed="false" aria-label="Show ${escape(c.name)}">${photo(c)}</button>`).join('')}</div>
    <header class="mc-collection-header"><h2>Wrapped, well made.</h2><span>2</span>${icon('sparkles')}</header>
    <div class="mc-keepsakes">${collabs.slice(3).map(c=>`<button class="mc-keepsake" data-open="${c.id}" aria-label="Open ${escape(c.name)} collab"><span class="mc-keepsake-photo">${photo(c)}</span><strong>${c.name}</strong><small>${icon('eye')}${c.views} views</small></button>`).join('')}</div>`;
  passes.querySelector('.mc-collection-panel').innerHTML=`<div class="mc-passes">${collabs.map((c,i)=>`
    <article class="mc-pass" data-pass="${i}" style="--pass-delay:${i*-1.2}s">${i===0?'<span class="mc-pass-stamp">ON THE RECORD</span>':''}
      <button class="mc-pass-main" data-expand="${i}" aria-expanded="false" aria-controls="mc-pass-detail-${c.id}" aria-label="${escape(c.name)}, ${c.stage}. Expand collab pass.">
        <span class="mc-pass-picture">${photo(c)}<span class="mc-cover-shade"></span><span class="mc-pass-serial">MIRACLE / ${String(i+1).padStart(3,'0')}</span></span>
        <span class="mc-pass-info">${status(c)}<h2>${c.name}</h2><span class="mc-pass-bottom"><small>${c.work}</small><b>${c.fee}</b></span><span class="mc-pass-toggle">${icon('chevron-down')}</span></span>
      </button>
      <div class="mc-pass-drawer" id="mc-pass-detail-${c.id}"><div class="mc-pass-extra"><div class="mc-pass-extra-in"><span>${icon(c.views==='—'?'camera':'eye')}${c.views==='—'?'On-location shoot':`${c.views} views`}</span><button class="mc-open-button" data-open="${c.id}">View collab${icon('arrow-up-right')}</button></div></div></div>
    </article>`).join('')}</div>`;

  function save(design,selectedName) {
    const selected=selectedName||(design==='Collab passes'?collabs[state.pass]?.name:collabs[state.index].name)||'Collection';
    window.openai?.setWidgetState?.({modelContent:{collabDesign:design,selectedCollab:selected,motion:state.playing?'Playing':'Paused'},privateContent:{index:state.index,pass:state.pass,playing:state.playing}})?.catch(()=>{});
  }
  function select(index,persist=true) {
    state.index=(index+collabs.length)%collabs.length;
    covers.querySelectorAll('.mc-cover').forEach((node,i)=>{
      let slot=(i-state.index+collabs.length)%collabs.length;
      if(slot>collabs.length/2)slot-=collabs.length;
      node.style.setProperty('--slot',slot);node.classList.toggle('is-selected',i===state.index);
      node.inert=Math.abs(slot)>1;
      node.setAttribute('aria-current',i===state.index?'true':'false');
    });
    covers.querySelectorAll('.mc-thumb').forEach((node,i)=>node.setAttribute('aria-pressed',String(i===state.index)));
    covers.querySelector('.mc-deck-caption').innerHTML=`<b>${String(state.index+1).padStart(2,'0')}</b> / 05 <span> · Swipe your collection</span>`;
    if(persist)save('Campaign covers');
  }
  function expand(index,persist=true) {
    state.pass=index;
    passes.querySelectorAll('.mc-pass').forEach((node,i)=>{
      const open=i===index;node.classList.toggle('is-open',open);
      node.querySelector('.mc-pass-main').setAttribute('aria-expanded',String(open));
      node.querySelector('.mc-pass-drawer').inert=!open;
    });
    if(persist)save('Collab passes');
  }
  let returnFocus=null;
  function openStory(phone,id) {
    const c=collabs.find(item=>item.id===id);if(!c)return;
    const reader=phone.querySelector('.mc-reader');
    reader.querySelectorAll('.mc-photo').forEach(node=>photos.unobserve(node));
    returnFocus=document.activeElement;
    reader.innerHTML=`<header class="mc-reader-bar"><span>Your collab story</span><button class="mc-icon-button" data-close aria-label="Close collab story">${icon('x')}</button></header><div class="mc-reader-visual">${photo(c)}<span class="mc-cover-shade"></span><div class="mc-reader-caption">${status(c)}<h2>${c.name}</h2></div></div><div class="mc-reader-data"><span><small>Created</small><b>${c.work}</b></span><span><small>${c.fee.includes('barter')||c.fee==='Barter'?'Barter value':'Deal value'}</small><b>${c.value}</b></span><span><small>Views</small><b>${c.views}</b></span></div><p class="mc-reader-note"><i>✦</i> ${c.stage==='Live'?'Out in the world. A little piece of your creative work.':'Wrapped up. Part of the work you’re known for.'}</p>`;
    reader.inert=false;phone.querySelector('.mc-shell').inert=true;reader.classList.add('is-open');phone.classList.add('is-reading');bindFresh(reader);
    const focusClose=()=>{if(reader.classList.contains('is-open'))reader.querySelector('[data-close]').focus({preventScroll:true});};
    const entrances=reader.getAnimations();
    if(entrances.length)Promise.allSettled(entrances.map(animation=>animation.finished)).then(focusClose);
    else focusClose();
    save(phone===covers?'Campaign covers':'Collab passes',c.name);
  }
  function closeStory(phone) {
    const reader=phone.querySelector('.mc-reader');reader.classList.remove('is-open');reader.inert=true;phone.querySelector('.mc-shell').inert=false;phone.classList.remove('is-reading');
    if(returnFocus instanceof HTMLElement&&returnFocus.isConnected)returnFocus.focus({preventScroll:true});
  }
  function renderAppearance() {
    [covers,passes].forEach(phone=>{
      phone.style.colorScheme=state.theme==='System'?'light dark':state.theme.toLowerCase();
      phone.style.setProperty('--mc-speed',state.motion==='Calm'?'2':'1');
      phone.classList.toggle('is-paused',!state.playing||state.motion==='Still'||reduced.matches);
      const button=phone.querySelector('.mc-motion');button.setAttribute('aria-pressed',String(!state.playing));button.setAttribute('aria-label',state.playing?'Pause motion':'Play motion');button.innerHTML=icon(state.playing?'pause':'play');
    });globalThis.lucide?.createIcons();
  }
  root.addEventListener('click',event=>{
    const button=event.target.closest('button');if(!button)return;
    const phone=button.closest('.mc-phone');if(!phone)return;
    if(button.matches('.mc-motion')){state.playing=!state.playing;renderAppearance();save(phone===covers?'Campaign covers':'Collab passes');return;}
    if(button.hasAttribute('data-close')){closeStory(phone);return;}
    if(button.hasAttribute('data-open')){openStory(phone,button.dataset.open);return;}
    if(button.hasAttribute('data-step')){select(state.index+Number(button.dataset.step));return;}
    if(button.hasAttribute('data-expand')){const index=Number(button.dataset.expand);expand(state.pass===index?-1:index);return;}
    if(button.hasAttribute('data-index')){const index=Number(button.dataset.index);if(button.classList.contains('mc-cover')&&index===state.index)openStory(phone,collabs[index].id);else select(index);return;}
    if(button.hasAttribute('data-panel')){
      const posts=button.dataset.panel==='posts';phone.querySelector('.mc-collection-panel').hidden=posts;phone.querySelector('.mc-posts').hidden=!posts;
      phone.querySelectorAll('[data-panel]').forEach(tab=>tab.setAttribute('aria-selected',String(tab===button)));save(phone===covers?'Campaign covers':'Collab passes');
    }
  });
  root.addEventListener('keydown',event=>{
    if(event.key==='Escape'){const phone=event.target.closest('.mc-phone');if(phone)closeStory(phone);}
    if(event.target.closest('.mc-deck')&&['ArrowLeft','ArrowRight'].includes(event.key)){event.preventDefault();select(state.index+(event.key==='ArrowLeft'?-1:1));}
    const reader=event.target.closest('.mc-reader.is-open');
    if(reader&&event.key==='Tab'){event.preventDefault();reader.querySelector('[data-close]').focus();}
  });
  const deck=covers.querySelector('.mc-deck');
  let gesture=null,suppressUntil=0;
  deck.addEventListener('pointerdown',event=>{
    suppressUntil=0;if(!event.isPrimary||event.button!==0)return;
    gesture={id:event.pointerId,x:event.clientX,y:event.clientY,dx:0,drag:false};
  });
  deck.addEventListener('pointermove',event=>{
    if(!gesture||event.pointerId!==gesture.id)return;
    const dx=event.clientX-gesture.x,dy=event.clientY-gesture.y;
    if(!gesture.drag&&Math.abs(dy)>Math.abs(dx)+8){gesture=null;return;}
    if(Math.abs(dx)>9&&Math.abs(dx)>Math.abs(dy)){
      gesture.drag=true;gesture.dx=dx;deck.classList.add('is-dragging');deck.setPointerCapture(event.pointerId);deck.style.setProperty('--drag',`${Math.max(-140,Math.min(140,dx))}px`);
    }
  });
  function endGesture(event) {
    if(!gesture||gesture.id!==event.pointerId)return;
    if(gesture.drag){suppressUntil=performance.now()+450;if(event.type==='pointerup'&&Math.abs(gesture.dx)>48)select(state.index+(gesture.dx<0?1:-1));}
    if(deck.hasPointerCapture(event.pointerId))deck.releasePointerCapture(event.pointerId);
    deck.classList.remove('is-dragging');deck.style.removeProperty('--drag');gesture=null;
  }
  deck.addEventListener('pointerup',endGesture);deck.addEventListener('pointercancel',endGesture);
  deck.addEventListener('click',event=>{if(performance.now()<suppressUntil){event.preventDefault();event.stopPropagation();}},true);
  deck.addEventListener('dragstart',event=>event.preventDefault());
  deck.addEventListener('pointermove',event=>{
    if(event.pointerType!=='mouse'||gesture||reduced.matches||!state.playing)return;
    const rect=deck.getBoundingClientRect(),card=deck.querySelector('.is-selected');
    card.style.setProperty('--tilt-x',`${(event.clientX-rect.left-rect.width/2)/rect.width*7}deg`);
    card.style.setProperty('--tilt-y',`${-(event.clientY-rect.top-rect.height/2)/rect.height*5}deg`);
  });
  deck.addEventListener('pointerleave',()=>deck.querySelectorAll('.mc-cover').forEach(node=>{node.style.removeProperty('--tilt-x');node.style.removeProperty('--tilt-y');}));
  function syncBackground(){[covers,passes].forEach(phone=>phone.classList.toggle('is-background',document.hidden));}
  document.addEventListener('visibilitychange',syncBackground);reduced.addEventListener('change',renderAppearance);
  window.addEventListener('openai:set_globals',event=>{
    const snapshot=event.detail?.globals?.widgetState?.privateContent;if(!snapshot)return;
    if(Number.isInteger(snapshot.index))select(snapshot.index,false);
    if(Number.isInteger(snapshot.pass))expand(snapshot.pass,false);
    if(typeof snapshot.playing==='boolean')state.playing=snapshot.playing;
    renderAppearance();
  });
  select(state.index,false);expand(state.pass,false);renderAppearance();syncBackground();bindFresh(root);
  if(globalThis.Tweak){
    const appearance=new Tweak({container:root,onChange:renderAppearance});
    appearance.addSelect(state,'theme',{label:'Appearance',options:['Dark','Light','System']});
    appearance.addSelect(state,'motion',{label:'Motion',options:['Expressive','Calm','Still']});
  }
})();
</script>
