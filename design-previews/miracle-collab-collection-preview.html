    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;

    min-height: 44px;

  }

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {

          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))

      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)

      privateContent: null,

  const connectorGlobals = {};
  if (mockElement != null) {
    const values = new Map(Object.entries(parse(mockElement.textContent)));
    mockElement.remove();
    connectorGlobals.visualizationData = {
      updates: Array.from(values, ([name, value]) =&gt; ({
        name,
        revision: 1,
        state: &quot;ready&quot;,
        value: { type: &quot;json&quot;, value },
      })),
    };

      /** @param {string} name @param {(value: unknown) =&gt; void} callback */
      onData(name, callback) {
        if (typeof callback !== &quot;function&quot;) {
          throw new TypeError(&quot;onData requires a callback&quot;);
        }
        try {
          callback(values.get(name));
        } catch (error) {
          // oxlint-disable-next-line no-console -- Keep authored callback failures local.
          console.error(&quot;Live visualization data callback failed&quot;, error);
        }
        // A static preview delivers the current fixture once per subscription.
        return () =&gt; {};
      },
    };
  }
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      ...connectorGlobals,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {

                }

            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true

        return;
      }

        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });

})();

  #miracle-collab-collection .mc-stage { display:grid;place-items:center;min-height:864px;padding:12px 0; }
  #miracle-collab-collection .mc-phone {
    --mc-bg:light-dark(#f8f3f6,#110d12);--mc-surface:light-dark(#ffffff,#211922);--mc-fill:light-dark(#efe7f1,#302333);
    --mc-ink:light-dark(#241a25,#f9f1f7);--mc-muted:light-dark(#756675,#baacbb);--mc-line:light-dark(#ddcfdd,#3a2c3d);
    --mc-purple:light-dark(#7749d9,#b390ff);--mc-pink:light-dark(#ce356f,#f36c9d);--mc-peach:light-dark(#a9612e,#ffb57e);--mc-green:light-dark(#21765e,#78dfc0);
    --mc-photo-ink:#fff7fc;--mc-photo-shade:#160c17;--mc-cover-height:326px;--mc-speed:1;
    position:relative;isolation:isolate;width:min(100%,394px);height:840px;overflow:clip;border:1px solid var(--mc-line);border-radius:32px;
    background:var(--mc-bg);color:var(--mc-ink);font:400 13px/1.45 Inter,system-ui,sans-serif;box-shadow:0 22px 65px -40px color-mix(in oklab,var(--mc-ink) 36%,transparent);color-scheme:dark;
  }
  #miracle-collab-collection .mc-phone * {box-sizing:border-box;}
  #miracle-collab-collection .mc-phone [hidden] {display:none!important;}
  #miracle-collab-collection .mc-phone button {font:inherit;color:inherit;cursor:var(--cursor-interaction,pointer);-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
  #miracle-collab-collection .mc-phone button:focus-visible {outline:2px solid var(--mc-purple);outline-offset:3px;}
  #miracle-collab-collection .mc-phone h1,#miracle-collab-collection .mc-phone h2,#miracle-collab-collection .mc-phone p {margin:0;}
  #miracle-collab-collection .mc-phone svg {width:18px;height:18px;flex:none;}
  #miracle-collab-collection .mc-shell {height:100%;display:flex;flex-direction:column;}
  #miracle-collab-collection .mc-status {display:flex;align-items:center;justify-content:space-between;padding:13px 23px 5px;min-height:33px;font-size:11px;font-weight:600;flex:none;}
  #miracle-collab-collection .mc-status &gt; span:last-child {display:flex;align-items:center;gap:5px;}
  #miracle-collab-collection .mc-status svg {width:12px;height:12px;}
  #miracle-collab-collection .mc-appbar {display:flex;align-items:center;gap:9px;padding:2px 17px 7px;flex:none;min-height:44px;}
  #miracle-collab-collection .mc-wordmark {font:400 24px/.9 &#x27;Instrument Serif&#x27;,Georgia,serif;letter-spacing:-.5px;}
  #miracle-collab-collection .mc-appbar &gt; span {flex:1;color:var(--mc-muted);font-size:11px;text-align:right;}
  #miracle-collab-collection .mc-icon-button {display:grid;place-items:center;width:40px;height:40px;flex:none;padding:0;border:0;border-radius:50%;background:var(--mc-fill);}
  #miracle-collab-collection .mc-icon-button svg {width:16px;height:16px;}
  #miracle-collab-collection .mc-scroll {flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none;position:relative;}
  #miracle-collab-collection .mc-scroll::-webkit-scrollbar {display:none;}
  #miracle-collab-collection .mc-topline {display:flex;align-items:center;justify-content:space-between;margin:13px 20px 0;}
  #miracle-collab-collection .mc-eyebrow {font-size:10px;text-transform:uppercase;letter-spacing:.17em;color:var(--mc-muted);font-weight:600;}
  #miracle-collab-collection .mc-live-summary {display:inline-flex;align-items:center;gap:6px;color:var(--mc-green);font-size:11px;}
  #miracle-collab-collection .mc-live-dot {display:inline-block;flex:none;width:6px;height:6px;border-radius:50%;background:var(--mc-green);position:relative;}
  #miracle-collab-collection .mc-live-dot::after {content:&#x27;&#x27;;position:absolute;inset:-4px;border-radius:50%;background:var(--mc-green);opacity:.25;animation:mc-signal calc(2.2s * var(--mc-speed)) ease-out infinite;}
  #miracle-collab-collection .mc-intro {position:relative;padding:5px 20px 17px;isolation:isolate;}
  #miracle-collab-collection .mc-intro h1 {font:400 42px/1.04 &#x27;Instrument Serif&#x27;,Georgia,serif;letter-spacing:-1px;}
  #miracle-collab-collection .mc-intro h1 em {font-weight:400;color:var(--mc-pink);}
  #miracle-collab-collection .mc-intro p {font-size:11px;color:var(--mc-muted);margin-top:7px;}
  #miracle-collab-collection .mc-intro::before {content:&#x27;&#x27;;position:absolute;z-index:-1;inset:-60px -60px -80px;pointer-events:none;background:radial-gradient(ellipse at 70% 30%,color-mix(in oklab,var(--mc-purple) 15%,transparent),transparent 58%);animation:mc-aura calc(7s * var(--mc-speed)) ease-in-out infinite alternate;}
  #miracle-collab-collection .mc-top-tabs {display:flex;align-items:center;gap:22px;padding:0 20px 12px;}
  #miracle-collab-collection .mc-top-tabs button {display:flex;align-items:center;justify-content:center;gap:6px;min-height:32px;padding:0 0 7px;border:0;border-bottom:2px solid transparent;background:none;color:var(--mc-muted);font-size:11px;}
  #miracle-collab-collection .mc-top-tabs button[aria-selected=true] {color:var(--mc-ink);border-color:var(--mc-pink);}
  #miracle-collab-collection .mc-top-tabs svg {width:14px;height:14px;}
  #miracle-collab-collection .mc-deck {position:relative;height:calc(var(--mc-cover-height) + 30px);perspective:1000px;touch-action:pan-y pinch-zoom;}
  #miracle-collab-collection .mc-deck-halo {position:absolute;inset:15% 0 0;pointer-events:none;background:radial-gradient(ellipse,color-mix(in oklab,var(--mc-pink) 18%,transparent),transparent 65%);animation:mc-aura calc(5s * var(--mc-speed)) ease-in-out infinite alternate;}
  #miracle-collab-collection .mc-cover {
    position:absolute;left:30px;top:5px;width:calc(100% - 60px);height:var(--mc-cover-height);padding:0;border:1px solid color-mix(in oklab,var(--mc-photo-ink) 19%,transparent);
    border-radius:25px;overflow:hidden;background:var(--mc-surface);text-align:left;transform-style:preserve-3d;
    transform:translateX(calc(var(--slot) * 89% + var(--drag,0px))) rotate(calc(var(--slot) * 5deg)) scale(var(--card-scale,.88));
    opacity:var(--card-opacity,.42);z-index:var(--z,0);transition:transform .65s cubic-bezier(.22,1.12,.35,1),opacity .45s,box-shadow .45s;

    "visualization-share-root",

  let sizeFingerprint = null;

    globalThis.location.pathname,
    globalThis.location.search,

  const sizeStorageKey = `${storageKey}:share-size-v1`;

      typeof serializedState !== "string" ||
      new TextEncoder().encode(serializedState).length > 16 * 1024

      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",

      state == null ||
      typeof state !== "object" ||

        typeof prompt !== "string" ||

  if (srcdoc == null) {

  globalThis.addEventListener("resize", () => {

    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {

    channel.port1.postMessage({ type: "measure" });

  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );

  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );

    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;

      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");

        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===

    }

  delete frame.dataset.srcdoc;
