# Weekly backup of the whole database (structure + data), encrypted with your own passphrase.
# Download it from the workflow run's "Artifacts" section. Copies are kept for 90 days.
# Restore guide: docs/SETUP.md, section "Restoring a backup".
name: Weekly backup

on:
  schedule:
    - cron: '30 20 * * 6' # every Sunday, 02:00 IST
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    # Connects the same way as "Deploy backend" (through Supabase's connection pooler): the database's
    # direct address is IPv6-only, which GitHub's machines can't reach.
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dump the database
        run: |
          supabase link --project-ref "$PROJECT_REF"
          mkdir backup
          supabase db dump --linked -f backup/roles.sql --role-only
          supabase db dump --linked -f backup/schema.sql
          supabase db dump --linked -f backup/data.sql --use-copy --data-only

      - name: Encrypt
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          name="collab-backup-$(date -u +%Y-%m-%d)"
          tar -czf "$name.tar.gz" backup
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" -c "$name.tar.gz"
          echo "NAME=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.tar.gz.gpg
          retention-days: 90
