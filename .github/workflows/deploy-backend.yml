# Pushes database changes (supabase/migrations) and server functions (supabase/functions)
# to the hosted Supabase project whenever they change on the main branch.
# The website itself is deployed by Cloudflare Pages, which watches the same repository.
name: Deploy backend

on:
  push:
    branches: [main]
    paths: ['supabase/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$PROJECT_REF"
      # Which migrations the hosted database has, and which are new (shown in the log).
      - run: supabase migration list --remote
      # The CLI aims at a local database unless told otherwise, and asks before changing production
      # (which a workflow can't answer): push to the linked, hosted project and confirm.
      - run: supabase db push --remote --yes
      - run: supabase functions deploy --project-ref "$PROJECT_REF" --yes
